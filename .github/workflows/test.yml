name: "Tests"

on:
  push:
    branches:
      - "**"
    tags:
      - "**"
  workflow_call:

permissions:
  contents: read
  actions: read
  checks: write

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            tasks: jvmTest jsTest wasmJsTest linuxX64Test
          - os: macos-latest
            tasks: jvmTest iosSimulatorArm64Test macosArm64Test tvosSimulatorArm64Test watchosSimulatorArm64Test
          - os: windows-latest
            tasks: jvmTest mingwX64Test

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: 'temurin'
          java-version: 24

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6

      - name: Run tests
        run: ./gradlew ${{ matrix.tasks }}

      - name: Publish Test Report
        if: always()
        uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3
        with:
          name: Tests Report (${{ matrix.os }})
          path: "**/build/test-results/**/*.xml"
          reporter: java-junit