# Unicode Character Database release the lookup tables and UnicodeScript enum are generated from.
kodepoint.unicodeVersion=18.0.0
# Unicode release implemented by java.lang.Character of the toolchain JDK (see jvmToolchain in buildSrc).
# The exhaustive JVM validation test expects the tables to differ from the JDK exactly by the UCD delta
# between this version and kodepoint.unicodeVersion. Bump it together with the toolchain.
kodepoint.jvmUnicodeVersion=16.0.0
